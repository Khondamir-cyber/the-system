<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#03060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="System">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  /* One visual world by choice: a dark holographic system window, single theme. */
  /* Layout: sticky header, one scrolling column of system windows, bottom tab bar. */
  --bg:#03060d;
  --panel:#081022;
  --line:#2b5c96;
  --glow:#45b8ff;
  --text:#dce9ff;
  --muted:#8197bd;
  --ok:#45f0a8;
  --warn:#ffc24d;
  --bad:#ff4d6d;
  --gold:#ffd36b;
  --fd:"Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --fb:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fm:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  background-image:
    radial-gradient(1200px 600px at 50% -200px, rgba(40,110,220,.22), transparent 70%),
    linear-gradient(rgba(69,184,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(69,184,255,.035) 1px, transparent 1px);
  background-size:auto, 28px 28px, 28px 28px;
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--fb);
  font-size:16px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 14px calc(96px + env(safe-area-inset-bottom));}
header.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 2px 10px;
  background:linear-gradient(180deg, var(--bg) 70%, rgba(3,6,13,0));
}
.brand{font-family:var(--fd);font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--glow);text-shadow:0 0 12px rgba(69,184,255,.6)}
.brand small{display:block;font-family:var(--fm);font-weight:400;letter-spacing:.06em;font-size:10.5px;color:var(--muted);text-shadow:none}
.sync{margin-left:auto;font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.sync.on{color:var(--ok);border-color:rgba(69,240,168,.45)}
.sync.busy{color:var(--warn);border-color:rgba(255,194,77,.45)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:4px;width:36px;height:32px;display:grid;place-items:center;color:var(--glow);cursor:pointer}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px;font-family:var(--fd);letter-spacing:.06em}
.datebar button{background:rgba(69,184,255,.08);border:1px solid var(--line);color:var(--glow);border-radius:4px;height:34px;min-width:44px;cursor:pointer;font-family:var(--fd)}
.datebar .d{text-align:center;font-size:15px}
.datebar .d small{display:block;color:var(--muted);font-family:var(--fm);font-size:11px;letter-spacing:.04em}

.win{
  position:relative;margin:0 0 14px;
  border:1px solid rgba(69,184,255,.5);
  background:linear-gradient(180deg, rgba(13,28,56,.94), rgba(6,12,26,.96));
  box-shadow:0 0 0 1px rgba(69,184,255,.07) inset, 0 0 22px rgba(40,140,255,.16);
  border-radius:3px;
}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win.red{border-color:rgba(255,77,109,.6);box-shadow:0 0 22px rgba(255,77,109,.18)}
.win.red::before,.win.red::after{border-color:var(--bad)}
.win-h{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid rgba(69,184,255,.18)}
.win-h h2{margin:0;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.2em;text-wrap:balance}
.win-h .tagx{color:var(--glow);font-size:12px}
.win.red .win-h .tagx,.win.red .win-h h2{color:var(--bad)}
.win-h .r{margin-left:auto;font-family:var(--fm);font-size:12px;color:var(--muted)}
.win-b{padding:12px 14px 14px}
.sub{color:var(--muted);font-size:13.5px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.k{font-family:var(--fd);letter-spacing:.12em;font-size:12px;color:var(--muted);text-transform:uppercase}

/* status */
.hunter{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.bigrank{width:74px;height:74px;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:46px;border:2px solid currentColor;border-radius:4px;box-shadow:0 0 18px currentColor inset, 0 0 14px currentColor;text-shadow:0 0 14px currentColor}
.hname{font-family:var(--fd);font-size:22px;font-weight:700;letter-spacing:.08em}
.statrow{display:grid;grid-template-columns:62px 1fr auto 30px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid rgba(69,184,255,.1)}
.statrow:first-child{border-top:0}
.statrow .lbl{font-family:var(--fd);letter-spacing:.14em;font-size:13px;color:var(--muted)}
.bar{height:6px;background:rgba(69,184,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2a7fff,var(--glow));box-shadow:0 0 8px var(--glow)}
.rk{font-family:var(--fd);font-weight:700;font-size:15px;width:28px;height:24px;display:grid;place-items:center;border:1px solid currentColor;border-radius:3px}
.rE{color:#8a96ad}.rD{color:#5fe0a0}.rC{color:#45b8ff}.rB{color:#b28cff}.rA{color:#ff9d4d}.rS{color:var(--gold)}

.quest{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(69,184,255,.1);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.quest:first-of-type{border-top:0}
.box{width:20px;height:20px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;flex:none;font-size:13px;color:var(--bg)}
.quest.done .box{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(69,240,168,.5)}
.quest .ql{flex:1}
.quest .qv{font-family:var(--fm);font-size:12.5px;color:var(--muted);text-align:right}
.quest.done .ql{color:var(--muted)}
.warnline{font-family:var(--fm);font-size:11.5px;color:var(--bad);margin-top:8px;letter-spacing:.02em}
.counter{font-family:var(--fd);font-weight:700;color:var(--glow)}

.msg{border-left:2px solid var(--glow);padding:6px 10px;margin:6px 0;background:rgba(69,184,255,.06);font-size:14px}
.msg.gold{border-color:var(--gold);background:rgba(255,211,107,.07)}
.msg.red{border-color:var(--bad);background:rgba(255,77,109,.07)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--glow);background:rgba(69,184,255,.12);color:var(--text);border-radius:4px;cursor:pointer;font-family:var(--fd);font-weight:600;letter-spacing:.08em;font-size:13.5px;text-transform:uppercase}
.btn:active{transform:translateY(1px)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--muted)}
.btn.ok{border-color:var(--ok);background:rgba(69,240,168,.12)}
.btn.bad{border-color:var(--bad);background:rgba(255,77,109,.1)}
.btn.small{min-height:32px;padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* inputs */
input[type=number],input[type=text],input[type=date],input[type=search],select,textarea{
  background:rgba(4,10,22,.9);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px;width:100%;color:var(--text)
}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--ok)}

/* train */
.ex{border-top:1px solid rgba(69,184,255,.14);padding:12px 0 6px}
.ex:first-child{border-top:0;padding-top:0}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.exh b{font-family:var(--fd);letter-spacing:.06em;font-size:16px}
.pres{font-family:var(--fm);font-size:12.5px;color:var(--glow)}
.set{display:grid;grid-template-columns:22px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin:5px 0}
.set .n{font-family:var(--fm);font-size:12px;color:var(--muted)}
.set input{min-height:38px;padding:6px 6px;text-align:center;font-family:var(--fm);font-size:14px}
.set .tick{height:38px;border:1px solid var(--line);background:transparent;border-radius:4px;color:var(--muted);cursor:pointer;font-size:16px}
.set.done .tick{background:var(--ok);border-color:var(--ok);color:#022;box-shadow:0 0 10px rgba(69,240,168,.45)}
.set.done input{border-color:rgba(69,240,168,.4)}
.sethead{display:grid;grid-template-columns:22px 1fr 1fr 1fr 44px;gap:6px;font-size:11px;color:var(--muted);font-family:var(--fm);text-align:center}
details{border:1px solid rgba(69,184,255,.2);border-radius:4px;padding:8px 12px;margin:0 0 12px;background:rgba(8,16,34,.6)}
summary{cursor:pointer;font-family:var(--fd);letter-spacing:.1em;font-size:13px;color:var(--glow)}
ol.tight,ul.tight{margin:8px 0 2px;padding-left:20px}
ol.tight li,ul.tight li{margin:3px 0}

/* fuel */
.ringwrap{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.macro{margin:6px 0}
.macro .spread{font-size:13.5px}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(69,184,255,.1)}
.entry .nm{font-size:14.5px}
.entry .nm small{display:block;color:var(--muted);font-family:var(--fm);font-size:11.5px}
.entry .kc{font-family:var(--fm);font-size:13px;text-align:right}
.x{background:none;border:1px solid transparent;color:var(--muted);width:32px;height:32px;border-radius:4px;cursor:pointer}
.x:hover{border-color:var(--bad);color:var(--bad)}
.mealh{font-family:var(--fd);letter-spacing:.14em;font-size:12px;color:var(--glow);margin:12px 0 2px;display:flex;justify-content:space-between}
.result{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid rgba(69,184,255,.15);border-radius:4px;margin:6px 0;cursor:pointer;background:rgba(8,16,34,.6);width:100%;text-align:left}
.result small{color:var(--muted);font-family:var(--fm);font-size:11.5px}
.tag{font-family:var(--fm);font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin-left:6px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--fm);font-size:10px;fill:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(3,6,13,.94);border-top:1px solid rgba(69,184,255,.35);backdrop-filter:blur(8px);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:none;border:1px solid transparent;border-radius:4px;color:var(--muted);padding:6px 0 5px;font-family:var(--fd);font-weight:600;letter-spacing:.14em;font-size:11px;cursor:pointer;display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--glow);border-color:rgba(69,184,255,.4);background:rgba(69,184,255,.08);text-shadow:0 0 10px rgba(69,184,255,.6)}

/* rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:31;display:flex;gap:10px;align-items:center;background:#06142a;border:1px solid var(--glow);box-shadow:0 0 20px rgba(69,184,255,.35);border-radius:4px;padding:8px 12px;font-family:var(--fm)}
.timer b{font-size:20px;color:var(--glow);min-width:64px;text-align:center}
.timer.zero{border-color:var(--ok)}
.timer.zero b{color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(1,3,8,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.modal .win{width:100%;max-width:540px;max-height:88vh;overflow:auto;margin:0;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.modal .win{animation:none}}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;background:#06142a;border:1px solid var(--glow);padding:10px 14px;border-radius:4px;font-size:14px;max-width:92vw;box-shadow:0 0 20px rgba(69,184,255,.35)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--glow);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.chip{display:inline-block;font-family:var(--fm);font-size:11.5px;padding:2px 7px;border-radius:3px;border:1px solid currentColor}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-glow{color:var(--glow)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:6px 4px;border-top:1px solid rgba(69,184,255,.1);text-align:left}
table.t th{font-family:var(--fd);letter-spacing:.1em;font-size:11.5px;color:var(--muted);font-weight:600}
table.t td.n{text-align:right;font-family:var(--fm)}
@media (max-width:380px){.ringwrap{grid-template-columns:96px 1fr}.statrow{grid-template-columns:54px 1fr auto 28px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">THE SYSTEM<small id="hdrsub">loading</small></div>
    <span class="sync" id="sync">LOCAL</span>
    <button class="iconbtn" id="gear" aria-label="Settings" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>
<div id="timer" class="timer hide" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="modalroot"></div>

<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* reads typed numbers with either a dot or a comma as the decimal mark (iPhone keypads in many regions show a comma) */
const num = v => { const t = String(v == null ? "" : v).trim().replace(/\s/g, "").replace(",", "."); return t === "" ? NaN : parseFloat(t); };
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const fmtKg = n => { const v = Math.round(n * 100) / 100; return (Number.isInteger(v) ? v.toString() : v.toFixed(2).replace(/0$/, "")); };
const pad = n => String(n).padStart(2, "0");
const fmt = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
const todayStr = () => fmt(new Date());
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice = s => { const d = parse(s); return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; };
const mondayOf = s => { const d = parse(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return fmt(d); };
const clone = o => JSON.parse(JSON.stringify(o));
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + pad(sec % 60); };
const parseTime = t => { if (!t) return 0; const p = String(t).trim().split(":").map(Number); if (p.some(isNaN)) return 0; return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p.length === 2 ? p[0]*60 + p[1] : p[0]*60; };

/* ================= constants ================= */
const LIFTS = { pull: "Pull up", dip: "Dip", squat: "Squat" };
const LETTERS = ["E","D","C","B","A","S"];
const RANK_T = {
  pull: [35, 45, 55, 67.5, 80],
  dip: [60, 70, 80, 90, 100],
  squat: [140, 150, 160, 180, 200],
  body: [20, 18, 16, 14, 12],
  run: [36, 33, 31, 30]
};
const MEALS = ["Breakfast","Lunch","Snack","Dinner","Treat"];
/* typical UK label values per 100 g; the user should log their own labels */
const BUILTIN = [
  { id:"b_yog", name:"Greek yogurt 0% fat", kcal:54, p:10.3, c:3, f:0 },
  { id:"b_oats", name:"Rolled oats (dry)", kcal:374, p:11, c:60, f:8 },
  { id:"b_berry", name:"Frozen mixed berries", kcal:40, p:1, c:7.5, f:0.2 },
  { id:"b_whey", name:"Whey protein powder", kcal:400, p:80, c:6, f:6 },
  { id:"b_chick", name:"Chicken breast, raw", kcal:106, p:24, c:0, f:1.1 },
  { id:"b_rice", name:"Basmati rice (dry)", kcal:350, p:8, c:77, f:1 },
  { id:"b_veg", name:"Mixed vegetables", kcal:35, p:3, c:4, f:0.5 },
  { id:"b_oil", name:"Olive oil", kcal:884, p:0, c:0, f:100 },
  { id:"b_skyr", name:"Skyr, plain", kcal:63, p:11, c:4, f:0.2 },
  { id:"b_banana", name:"Banana (peeled)", kcal:89, p:1.1, c:23, f:0.3, unitG:120 },
  { id:"b_beef", name:"Beef mince 5% fat, raw", kcal:124, p:21, c:0, f:5 },

/* ================= repeat rule: missed reps or RPE 10 means repeat that weight next session ================= */
function failures(date) {
  const pi = progInfo(date), t = dayType(date);
  if (pi.pre || !["A","B","F"].includes(t)) return [];
  const spec = mainSpec(pi.cw, t, date);
  if (typeof spec === "string") return [];
  const dd = peekDay(date), out = [];
  spec.forEach((e, idx) => {
    if (e.lift === "bo") return;
    const sets = (dd.sets || {})[e.lift + idx] || [];
    if (sets.some(s0 => s0 && s0.done && ((s0.reps || 0) < e.reps || (s0.rpe || 0) >= 10))) out.push(e.lift);
  });
  return out;
}

/* ================= measured maintenance ================= */
function measuredMaint() {
  const end = addDays(todayStr(), -1), start = addDays(end, -20);
  const kc = [], pts = [];
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const ft = foodTotals(d); if (ft.n >= 3) kc.push(ft.kcal);
    const w = peekDay(d).weight; if (w > 0) pts.push([diffDays(d, start), w]);
  }
  if (kc.length < 14 || pts.length < 8) return null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  const slope = pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
  const avg = kc.reduce((a, b) => a + b, 0) / kc.length;
  return { maint: Math.round((avg - slope * 7700) / 10) * 10, avg: Math.round(avg), slopeWk: slope * 7 };
}

function prepCanvas(img, maxW, rot) {
  const sc = Math.min(1, maxW / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
  const cv = document.createElement("canvas");
  if (rot) { cv.width = h; cv.height = w; } else { cv.width = w; cv.height = h; }
  const cx = cv.getContext("2d");
  if (rot) { cx.translate(h, 0); cx.rotate(Math.PI / 2); }
  cx.drawImage(img, 0, 0, w, h);
  return cv;
}
function loadImg(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}
function zxHints() {
  const Z = window.ZXing, hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);

}
async function decodeBarcodeFile(file) {

  const reader = new Z.MultiFormatReader(); reader.setHints(zxHints());

      const r = reader.decode(bmp); if (r) return r.getText();
    } catch (e) { reader.reset(); }
  }
  return null;
}

/* ---------- Open Food Facts (free, no key) ---------- */
const OFF_FIELDS = "code,product_name,product_name_en,brands,nutriments,serving_quantity";
function foodFromOff(p) {
  if (!p) return null;
  const n = p.nutriments || {};
  let kcal = n["energy-kcal_100g"];
  if (kcal == null && n["energy-kj_100g"] != null) kcal = n["energy-kj_100g"] / 4.184;
  if (kcal == null && n.energy_100g != null) kcal = n.energy_100g / 4.184;
  if (kcal == null) return null;
  const name = [p.product_name_en || p.product_name, p.brands ? String(p.brands).split(",")[0] : ""].filter(Boolean).join(", ") || "Product " + (p.code || "");
  return { name, kcal: r0(kcal), p: r1(n.proteins_100g || 0), c: r1(n.carbohydrates_100g || 0), f: r1(n.fat_100g || 0), barcode: p.code ? String(p.code) : undefined, serving: p.serving_quantity ? num(p.serving_quantity) : undefined, src: "Open Food Facts" };
}
async function offProduct(code) {

  if (!r.ok) return null;
  const j = await r.json();

}
async function offSearch(q) {

}
function saveOffFood(food) {

/* ---------- label reading on the phone (free text recognition) ---------- */
let tessLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoading) tessLoading = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return tessLoading;
}
async function ocrFile(file, onStatus) {
  await loadTesseract();
  const img = await loadImg(file);
  const cv = prepCanvas(img, 2000, false);
  const worker = await window.Tesseract.createWorker("eng", 1, { logger: m => { if (onStatus && m.status) onStatus(m.status + (m.progress ? " " + Math.round(m.progress * 100) + "%" : "")); } });
  try { const { data } = await worker.recognize(cv); return data.text || ""; } finally { await worker.terminate(); }
}
/* UK labels list per 100 g first; take the first number on each nutrient line */
function parseLabel(text) {
  const t = String(text).toLowerCase().replace(/(\d),(\d)/g, "$1.$2").replace(/[oO](?=\d)/g, "0");
  const lines = t.split(/\n/);
  const firstNum = s => { const m = s.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : null; };
  const out = {};
  const kcalM = t.match(/(\d+(?:\.\d+)?)\s*kcal/);
  if (kcalM) out.kcal = parseFloat(kcalM[1]);
  else { const kj = t.match(/(\d+(?:\.\d+)?)\s*kj/); if (kj) out.kcal = Math.round(parseFloat(kj[1]) / 4.184); }
  lines.forEach(l => {
    const s = l.trim();
    if (out.f == null && /^fat\b/.test(s)) out.f = firstNum(s.replace(/^fat/, ""));
    if (out.c == null && /^carbohydrate/.test(s)) out.c = firstNum(s.replace(/^carbohydrates?/, ""));
    if (out.p == null && /^protein/.test(s)) out.p = firstNum(s.replace(/^protein/, ""));
  });
  return out;
}

/* ---------- describe a meal: your foods first, then Open Food Facts ---------- */
const WORDN = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, half: 0.5 };
const stem = w => w.replace(/(ies)$/, "y").replace(/(es|s)$/, "");
const toks = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w && !["of","the","some","with","and","a","an","g","grams","gram","raw","dry","plain","x"].includes(w)).map(stem);
function matchFood(name) {
  const q = toks(name); if (!q.length) return null;
  let best = null, bs = 0;
  allFoods().forEach(f => {
    const ft = toks(f.name);
    const hit = q.filter(w => ft.includes(w)).length;
    const score = hit / q.length + hit / Math.max(ft.length, 1) * 0.25;
    if (hit && score > bs) { bs = score; best = f; }
  });
  return bs >= 0.6 ? best : null;
}
function parseMealText(text) {
  return String(text).toLowerCase().replace(/(\d),(\d)/g, "$1.$2").split(/,|;|\n|\band\b|\bplus\b|\+/).map(x => x.trim()).filter(Boolean).map(chunk => {
    let grams = null, count = null, name = chunk;
    const m = chunk.match(/(\d+(?:\.\d+)?)\s*(kg|kilos?|g|grams?|gr|ml|l|litres?|tbsp|tablespoons?|tsp|teaspoons?)\b/);
    if (m) {
      const v = parseFloat(m[1]), u = m[2];
      grams = /^kg|^kilo|^l$|^litre/.test(u) ? v * 1000 : /^tbsp|^tablespoon/.test(u) ? v * 13 : /^tsp|^teaspoon/.test(u) ? v * 5 : v;
      name = chunk.replace(m[0], " ");
    } else {
      const c = chunk.match(/^(\d+(?:\.\d+)?|a|an|one|two|three|four|five|six|half)\s+/);
      if (c) { count = WORDN[c[1]] != null ? WORDN[c[1]] : parseFloat(c[1]); name = chunk.slice(c[0].length); }
    }
    return { raw: chunk, name: name.replace(/\s+/g, " ").trim(), grams, count };
  }).filter(x => x.name);
}
async function resolveMeal(text) {
  const parts = parseMealText(text), out = [];
  for (const p of parts) {
    let f = matchFood(p.name), est = false, src = "saved";
    if (!f) {
      try { const r = await offSearch(p.name); f = r[0] || null; est = true; src = "Open Food Facts"; } catch (e) { f = null; }
    }
    let g = p.grams;
    if (g == null && f) g = p.count != null ? p.count * (f.unitG || f.serving || 100) : (f.unitG || f.serving || 100);
    if (g == null) g = 100;
    out.push({ query: p.raw, food: f, grams: Math.round(g), est: est || p.grams == null && !(f && f.unitG), src });
  }
  return out;
}

    <div style="margin-top:10px">${status} ${rng ? `<span class="sub mono">target ${rng[0]} to ${rng[1]} kg loss</span>` : ""}</div>
    <div class="msg" style="margin-top:10px">${esc(rec)}</div>
    ${recDelta && complete ? (applied ? `<span class="chip c-ok">Applied: ${pr.adj[wn] > 0 ? "+" : "minus "}${Math.abs(pr.adj[wn])} kcal</span> <button class="btn small ghost" type="button" data-act="adjundo" data-w="${wn}">Undo</button>` : `<button class="btn" type="button" data-act="adjapply" data-w="${wn}" data-v="${recDelta}">Apply ${recDelta > 0 ? "+" : "minus "}${Math.abs(recDelta)} kcal</button>`) : ""}
    <div class="sub" style="margin-top:8px">Current target: ${targets(t).kcal} kcal · P ${targets(t).p} · C ${targets(t).c} · F ${targets(t).f}</div>
  `);
  h += win("ADHERENCE", `
    <table class="t">
      <tr><td>Days cleared</td><td class="n">${cl} / ${past.filter(d => d >= pr.startDate).length}</td></tr>
      <tr><td>Avg calories (logged days)</td><td class="n">${avgK ?? "none"}</td></tr>
      <tr><td>Avg protein</td><td class="n">${avgP != null ? avgP + " g" : "none"}</td></tr>
      <tr><td>Avg steps</td><td class="n">${avgS != null ? avgS.toLocaleString("en-GB") : "none"}</td></tr>
      <tr><td>Main sessions</td><td class="n">${mainsDone} / ${mains.length}</td></tr>
      <tr><td>Runs</td><td class="n">${runsDone} / 3</td></tr>
    </table>
  `);
  h += win("MAINTENANCE", mm ? `<div class="mono" style="font-size:22px;color:var(--glow)">${mm.maint} kcal</div><div class="sub">Measured from the last 21 days: you ate ${mm.avg} kcal on average while your weight trend moved ${mm.slopeWk <= 0 ? "down" : "up"} ${r1(Math.abs(mm.slopeWk))} kg a week. Use this when you switch to maintenance or lean gain.</div>` : `<div class="sub">Needs 14 logged days and 8 weigh ins in the last 3 weeks. The starting estimate is about 2,800 kcal.</div>`);
  h += win("HUNTER RANKS", `<table class="t">${[["Pull up","pull"],["Dip","dip"],["Squat","squat"],["Body","body"],["Run","run"]].map(([n, k]) => `<tr><td>${n}</td><td class="n">${rk(R[k].i)}</td><td class="sub" style="font-size:12px">${R[k].i < 5 ? "next: " + nextRank(k, R[k].i) : "complete"}</td></tr>`).join("")}</table>`);
  return h;
}
function nextRank(k, i) {
  if (k === "pull") return "+" + RANK_T.pull[i] + " kg";
  if (k === "dip") return "+" + RANK_T.dip[i] + " kg";
  if (k === "squat") return RANK_T.squat[i] + " kg";
  if (k === "body") return RANK_T.body[i] + "% body fat";
  if (k === "run") return i === 0 ? "finish a 5k" : "5k under " + RANK_T.run[i - 1] + ":00";
  return "";
}
function renderAccount(box) {
  if (!box) return;
  if (!SB) { box.innerHTML = `<div class="sub">Sync is not set up in this copy of the app (missing config). Your data stays on this device.</div>`; return; }
  if (SESSION) {
    box.innerHTML = `<div class="sub">Signed in as <b>${esc(SESSION.user.email || "")}</b>. Status: ${esc(syncState)}.</div><div class="row" style="margin-top:8px"><button class="btn small" type="button" id="ac_sync">Sync now</button><button class="btn small ghost" type="button" id="ac_out">Sign out</button></div>`;
    $("#ac_sync", box).addEventListener("click", async () => { await flush(); await pull(true); toast("Synced."); });
    $("#ac_out", box).addEventListener("click", async () => { await SB.auth.signOut(); SESSION = null; setSync("signin"); renderAccount(box); });
    return;
  }
  box.innerHTML = `<div class="grid2"><label class="f">Email<input type="text" inputmode="email" autocomplete="username" id="ac_e"></label><label class="f">Password<input type="password" autocomplete="current-password" id="ac_p" style="background:rgba(4,10,22,.9);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px;width:100%;color:var(--text)"></label></div>
    <div class="row" style="margin-top:8px"><button class="btn small ok" type="button" id="ac_in">Sign in</button><button class="btn small ghost" type="button" id="ac_up">Create account</button></div>
    <div class="sub" id="ac_msg" style="margin-top:6px">Use the same account on your phone and laptop.</div>`;
  const go = async up => {
    const email = $("#ac_e", box).value.trim(), password = $("#ac_p", box).value;
    if (!email || password.length < 6) { $("#ac_msg", box).textContent = "Enter an email and a password of at least 6 characters."; return; }
    $("#ac_msg", box).textContent = "Working...";
    const { data, error } = up ? await SB.auth.signUp({ email, password }) : await SB.auth.signInWithPassword({ email, password });
    if (error) { $("#ac_msg", box).textContent = error.message; return; }
    if (!data.session) { $("#ac_msg", box).textContent = "Account created. Confirm the email Supabase sent you, then sign in."; return; }
    SESSION = data.session; await afterSignIn(); renderAccount(box); render(); toast("Signed in. Sync is on.");
  };
  $("#ac_in", box).addEventListener("click", () => go(false));
  $("#ac_up", box).addEventListener("click", () => go(true));
}
/* ================= SETTINGS ================= */
function settingsModal() {
  const pr = P(), bw = bwAvg(todayStr());
  openModal("SETTINGS", `
    <div class="grid2">
      <label class="f">Name<input type="text" id="s_name" value="${esc(pr.name)}"></label>
      <label class="f">Program start (a Monday)<input type="date" id="s_start" value="${pr.startDate}"></label>
      <label class="f">Height cm<input type="text" autocomplete="off" inputmode="decimal" id="s_h" value="${pr.heightCm}"></label>
      <label class="f">Starting bodyweight kg<input type="text" autocomplete="off" inputmode="decimal" id="s_bw" value="${pr.bw0}"></label>
    </div>
    <div class="k" style="margin:14px 0 6px">Week 1 starting weights (Monday Day A, Wednesday Day B)</div>
    <div class="grid3">
      ${["pull","dip","squat"].map(l => `<label class="f">${LIFTS[l]} A<input type="text" autocomplete="off" inputmode="decimal" id="s_${l}A" value="${pr.start[l].A}"></label>`).join("")}
      ${["pull","dip","squat"].map(l => `<label class="f">${LIFTS[l]} B<input type="text" autocomplete="off" inputmode="decimal" id="s_${l}B" value="${pr.start[l].B}"></label>`).join("")}
    </div>
    <div class="k" style="margin:14px 0 6px">Calories</div>
    <div class="grid2">
      <label class="f">Mode<select id="s_mode"><option value="cut" ${pr.mode === "cut" ? "selected" : ""}>Cut (plan)</option><option value="maintain" ${pr.mode === "maintain" ? "selected" : ""}>Maintain</option><option value="gain" ${pr.mode === "gain" ? "selected" : ""}>Lean gain (+200)</option></select></label>
      <label class="f">Maintenance kcal<input type="text" autocomplete="off" inputmode="numeric" id="s_maint" value="${pr.maint}"></label>
    </div>
    <div class="sub" style="margin-top:6px">Applied weekly adjustments: ${Object.keys(pr.adj).length ? Object.keys(pr.adj).map(w => "week " + w + ": " + (pr.adj[w] > 0 ? "+" : "minus ") + Math.abs(pr.adj[w])).join(", ") : "none"}.</div>
    <div class="row" style="margin-top:14px"><button class="btn ok" type="button" id="s_ok">Save</button><button class="btn ghost" type="button" id="s_bk">Backup</button><button class="btn ghost" type="button" id="s_im">Restore</button></div>
    <div id="s_extra"></div>
    <div class="k" style="margin:16px 0 6px">Sync account</div>
    <div id="s_acct"></div>
  `, (el, close) => {
    $("#s_ok", el).addEventListener("click", () => {
      let st = $("#s_start", el).value || pr.startDate;
      st = mondayOf(st);
      pr.name = $("#s_name", el).value.trim() || pr.name;
      pr.startDate = st;
      pr.heightCm = num($("#s_h", el).value) || pr.heightCm;
      pr.bw0 = num($("#s_bw", el).value) || pr.bw0;
      ["pull","dip","squat"].forEach(l => ["A","B"].forEach(k => { const v = num($("#s_" + l + k, el).value); if (v >= 0) pr.start[l][k] = v; }));
      pr.mode = $("#s_mode", el).value;
      pr.maint = num($("#s_maint", el).value) || pr.maint;
      saveProfile(); close(); render(); toast("Settings saved.");
    });
    renderAccount($("#s_acct", el));
    $("#s_bk", el).addEventListener("click", () => {
      const txt = JSON.stringify(S);
      $("#s_extra", el).innerHTML = `<label class="f" style="margin-top:10px">Backup (copy and keep somewhere safe)<textarea id="s_bt" readonly>${esc(txt)}</textarea></label><button class="btn small" type="button" id="s_cp" style="margin-top:6px">Copy</button>`;
      $("#s_cp", el).addEventListener("click", () => { navigator.clipboard.writeText(txt).then(() => toast("Copied."), () => { $("#s_bt", el).select(); toast("Select and copy the text."); }); });
    });
    $("#s_im", el).addEventListener("click", () => {
      $("#s_extra", el).innerHTML = `<label class="f" style="margin-top:10px">Paste a backup<textarea id="s_it"></textarea></label><button class="btn small bad" type="button" id="s_go" style="margin-top:6px">Replace all data with this backup</button>`;
      $("#s_go", el).addEventListener("click", () => {
        try {
          const o = JSON.parse($("#s_it", el).value);
          if (!o || !o.profile) throw 0;
          S.profile = normProfile(o.profile); S.days = o.days || {}; S.foods = o.foods || {};
          saveProfile(); Object.keys(S.days).forEach(saveDay); Object.keys(S.foods).forEach(saveFood);
          close(); render(); toast("Backup restored.");
        } catch (e) { toast("That text is not a valid backup."); }
      });
    });
  });
}

/* ================= quick input modals ================= */
function numberModal(title, label, key, step, unit) {
  const d = VIEW.tab === "status" ? todayStr() : VIEW.date;
  const dd = peekDay(d);
  openModal(title, `<label class="f">${esc(label)}<input type="text" autocomplete="off" inputmode="decimal" step="${step}" id="nm_v" value="${dd[key] || ""}"></label><div class="row" style="margin-top:12px"><button class="btn ok" type="button" id="nm_ok">Save</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`, (el, close) => {
    const i = $("#nm_v", el); setTimeout(() => i.focus(), 50);
    const go = () => { const v = num(i.value); const o = dayObj(d); if (v > 0) o[key] = key === "steps" ? Math.round(v) : v; else delete o[key]; saveDay(d); close(); render(); };
    $("#nm_ok", el).addEventListener("click", go);
    i.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { VIEW.tab = tb.dataset.tab; if (VIEW.tab !== "report") VIEW.date = VIEW.date || todayStr(); try { localStorage.setItem("system_tab", VIEW.tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  const q = e.target.closest("[data-q]");
  if (q) {
    const id = q.dataset.q, t = todayStr();
    if (id === "weigh") numberModal("WEIGH IN", "Morning weight kg", "weight", 0.1);
    else if (id === "steps") numberModal("STEPS", "Steps today (from iPhone Health)", "steps", 100);
    else if (id === "sleep" || id === "supps") { const o = dayObj(t); o[id] = !o[id]; saveDay(t); render(); }
    else if (id === "train") { VIEW.tab = "train"; VIEW.date = t; render(); window.scrollTo(0, 0); }
    else { VIEW.tab = "fuel"; VIEW.date = t; render(); window.scrollTo(0, 0); }
    return;
  }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "day") { const n = +a.dataset.n; const nd = addDays(VIEW.date, n); if (nd <= todayStr()) { VIEW.date = nd; render(); } return; }
  if (act === "rweek") { VIEW.reportWeek = Math.max(1, VIEW.reportWeek + (+a.dataset.n)); render(); return; }
  if (act === "scan") { scannerModal(); return; }
  if (act === "label") { $("#labelfile").click(); return; }
  if (act === "describe") { describeModal(); return; }
  if (act === "newfood") { newFoodModal(); return; }
  if (act === "lib") { VIEW.libOpen = !VIEW.libOpen; render(); return; }
  if (act === "pickfood") { const f = foodById(a.dataset.id); if (f) gramsModal(f); return; }
  if (act === "planmeal") {
    const m = a.dataset.m, dd = dayObj(VIEW.date); dd.foods = dd.foods || [];
    PLAN_MEALS[m].forEach(([id, g]) => dd.foods.push(entryFrom(foodById(id), g, m, false)));
    saveDay(VIEW.date); render(); toast(m + " from the plan logged. Edit any item to match what you ate."); return;
  }
  if (act === "copyday") {
    const y = peekDay(addDays(VIEW.date, -1)).foods || [];
    if (!y.length) { toast("Nothing logged the day before."); return; }
    const dd = dayObj(VIEW.date); dd.foods = (dd.foods || []).concat(clone(y)); saveDay(VIEW.date); render(); toast("Copied " + y.length + " items."); return;
  }
  if (act === "delentry") { const dd = dayObj(VIEW.date); dd.foods.splice(+a.dataset.i, 1); saveDay(VIEW.date); render(); return; }
  if (act === "editentry") {
    const i = +a.dataset.i, en = peekDay(VIEW.date).foods[i];
    const per = en.g > 0 ? { id: en.ref, name: en.name, kcal: en.kcal / en.g * 100, p: en.p / en.g * 100, c: en.c / en.g * 100, f: en.f / en.g * 100 } : foodById(en.ref);
    if (per) gramsModal(per, { edit: i, g: en.g, meal: en.meal, est: en.est, title: "EDIT ENTRY" });
    return;
  }
  if (act === "editfood") { const id = a.dataset.id, f = S.foods[id]; newFoodModal({ title: "EDIT FOOD", editId: id, name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f, barcode: f.barcode }); return; }
  if (act === "delfood") {
    const id = a.dataset.id, nm = S.foods[id] && S.foods[id].name;
    openModal("DELETE FOOD", `<p style="margin-top:0">Delete ${esc(nm)} from your saved foods? Past log entries stay.</p><div class="row"><button class="btn bad" type="button" id="df_ok">Delete</button><button class="btn ghost" type="button" data-close>Keep</button></div>`, (el, close) => {
      $("#df_ok", el).addEventListener("click", () => { delete S.foods[id]; saveFood(id); close(); render(); });
    });
    return;
  }
  if (act === "toggle") { return; }
  if (act === "settick") {
    const d = VIEW.date, pi = progInfo(d), spec = mainSpec(pi.cw, dayType(d), d), i = +a.dataset.i, e = spec[i], key = a.dataset.key, k = +a.dataset.k;
    const dd = dayObj(d); dd.sets = dd.sets || {};
    const arr = getSets(d, key, e, bwAvg(d));
    arr[k] = Object.assign({}, arr[k], { done: !arr[k].done });
    dd.sets[key] = arr; saveDay(d); render();
    if (arr[k].done && d === todayStr()) startTimer(pi.cw >= 8 ? 210 : 150);
    return;
  }
  if (act === "complete") { const dd = dayObj(VIEW.date); dd.sessionDone = true; saveDay(VIEW.date); stopTimer(); render(); toast("Session complete. Quest updated."); return; }
  if (act === "reopen") { const dd = dayObj(VIEW.date); dd.sessionDone = false; saveDay(VIEW.date); render(); return; }
  if (act === "repeat" || act === "keepplan") {
    const d = VIEW.date, l = a.dataset.l, t = dayType(d), pr = P();
    pr.failSeen = pr.failSeen || {}; pr.shifts = pr.shifts || [];
    if (act === "repeat") pr.shifts.push({ lift: l, series: t === "B" ? "B" : "A", from: addDays(d, 1), kg: -INC[l] });
    pr.failSeen[d + l] = act === "repeat" ? "repeat" : "keep";
    saveProfile(); render(); toast(act === "repeat" ? LIFTS[l] + ": same weight next time." : "Plan kept."); return;
  }
  if (act === "testsave") {
    const d = VIEW.date, bw = bwAvg(d), dd = dayObj(d), pr = P();
    const vals = { pull: num($("#ts_pull").value), dip: num($("#ts_dip").value), squat: num($("#ts_squat").value) };
    dd.test = {};
    Object.keys(vals).forEach(l => {
      const v = vals[l]; if (!(v >= 0) || isNaN(v)) return;
      dd.test[l] = v;
      const sys = l === "squat" ? v : v + bw;
      pr.best[l] = { sys, src: "tested", date: d };
      void sys;
    });
    dd.testDone = true; saveDay(d); saveProfile(); render(); toast("Results recorded. New cycle uses these maxes."); return;
  }
  if (act === "adjapply") { P().adj[a.dataset.w] = +a.dataset.v; saveProfile(); render(); toast("Calorie target updated."); return; }
  if (act === "adjundo") { delete P().adj[a.dataset.w]; saveProfile(); render(); return; }
  if (act === "tplus") { if (timerState) { const left = Math.max(0, (timerState.end - Date.now()) / 1000); startTimer(left + 30); } return; }
  if (act === "tstop") { stopTimer(); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  const d = VIEW.date;
  if (el.dataset && el.dataset.act === "toggle") { const t = VIEW.tab === "status" ? todayStr() : d; const o = dayObj(t); o[el.dataset.k] = el.checked; saveDay(t); render(); return; }
  if (el.dataset && el.dataset.act === "skill") {
    const o = dayObj(d); o.skill = o.skill || {}; o.skill[el.dataset.k] = el.checked;
    const list = dayType(d) === "S" ? SKILL_S : SKILL_T;
    o.skillDone = list.every(x => o.skill[x.k]);
    saveDay(d); render(); return;
  }
  if (el.dataset && el.dataset.act === "rundone") { const o = dayObj(d); o.run = o.run || {}; o.run.done = el.checked; saveDay(d); render(); return; }
  if (el.dataset && el.dataset.act === "setval") {
    const pi = progInfo(d), spec = mainSpec(pi.cw, dayType(d), d), i = +el.dataset.i, ex0 = spec[i], key = el.dataset.key, k = +el.dataset.k;
    const o = dayObj(d); o.sets = o.sets || {};
    const arr = getSets(d, key, ex0, bwAvg(d));
    const v = num(el.value);
    arr[k] = Object.assign({}, arr[k], { [el.dataset.f]: isNaN(v) ? 0 : v });
    o.sets[key] = arr; saveDay(d); return;
  }
  if (el.id === "sknote") { const o = dayObj(d); o.skillNote = el.value; saveDay(d); return; }
  if (el.id === "run_d" || el.id === "run_t") {
    const o = dayObj(d); o.run = o.run || {};
    if (el.id === "run_d") o.run.dist = num(el.value) || 0; else o.run.time = parseTime(el.value);
    saveDay(d); render(); return;
  }
  if (el.id === "b_w" || el.id === "b_waist" || el.id === "b_neck" || el.id === "b_steps") {
    const key = { b_w: "weight", b_waist: "waist", b_neck: "neck", b_steps: "steps" }[el.id];
    const o = dayObj(d), v = num(el.value);
    if (v > 0) o[key] = key === "steps" ? Math.round(v) : v; else delete o[key];
    saveDay(d); render(); return;
  }
  if (el.id === "labelfile") { const f = el.files && el.files[0]; el.value = ""; if (f) handleLabel(f); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "fsearch") { VIEW.search = e.target.value; const r = $("#fresults"); if (r) r.innerHTML = foodResults(VIEW.search); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalClose) modalClose(); });
$("#gear").addEventListener("click", settingsModal);

/* day rollover while the page stays open */
let lastDay = todayStr();
setInterval(() => { const t = todayStr(); if (t !== lastDay) { if (VIEW.date === lastDay) VIEW.date = t; lastDay = t; render(); } }, 60000);

render();
initSync();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
